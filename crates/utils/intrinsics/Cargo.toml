[package]
name = "libcrux-intrinsics"
version = "0.0.10"
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
description = "Libcrux intrinsics crate"
exclude = ["/proofs"]

[dependencies]

[target.'cfg(hax)'.dependencies]
core-models = { path = "../core-models", version = "0.0.7", optional = true }
hax-lib = { workspace = true, optional = true }

[features]
simd128 = []
simd256 = []
# Proof tooling. `cargo hax` builds with `--cfg hax` and needs this feature
# for the `cfg(hax)` code; it is optional so that `hax-lib` stays out of
# the lockfiles of crates that depend on this one.
hax = ["dep:hax-lib", "dep:core-models"]

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(pre_core_models)',
    'cfg(eurydice)',
] }
