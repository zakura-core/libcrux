[package]
name = "libcrux-secrets"
description = "Libcrux utilities for working with secrets"
version = "0.0.8"
readme = "README.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
exclude = ["/proofs"]

[dependencies]

[target.'cfg(valgrind_ct_test)'.dependencies]
crabgrind.workspace = true

[target.'cfg(hax)'.dependencies]
hax-lib = { workspace = true, optional = true }

[features]
check-secret-independence = []
# Proof tooling. `cargo hax` builds with `--cfg hax` and needs this feature
# for the `cfg(hax)` code; it is optional so that `hax-lib` stays out of
# the lockfiles of crates that depend on this one.
hax = ["dep:hax-lib"]

[dev-dependencies]
criterion = "0.8.0"
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(valgrind_ct_test)'
] }
