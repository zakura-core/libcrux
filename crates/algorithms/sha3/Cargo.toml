[package]
name = "libcrux-sha3"
version = "0.0.12"
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
readme = "README.md"
description = "Libcrux SHA-3 implementation"
exclude = ["/proofs", "/c.sh", "/c.yaml", "tests/cavp.rs", "hax.py"]

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
libcrux-platform.workspace = true
libcrux-intrinsics.workspace = true
libcrux-traits.workspace = true

[target.'cfg(hax)'.dependencies]
hax-lib = { workspace = true, optional = true }

[features]
simd128 = ["libcrux-intrinsics/simd128"]
simd256 = ["libcrux-intrinsics/simd256"]
# Proof tooling. `cargo hax` builds with `--cfg hax` and needs this feature
# for the `cfg(hax)` code; it is optional so that `hax-lib` stays out of
# the lockfiles of crates that depend on this one.
hax = ["dep:hax-lib", "libcrux-intrinsics/hax", "libcrux-traits/hax"]

[[bench]]
name = "sha3"
harness = false

[dev-dependencies]
criterion = "0.8.0"
hex = "0.4.3"
rand = "0.10"
libcrux-kats = { workspace = true, features = ["sha3"] }
pretty_env_logger = "0.5.0"
clap = { version = "4.5.39", features = ["derive"] }
hacspec_sha3 = { path = "../../../specs/sha3" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hax)', 'cfg(eurydice)'] }
