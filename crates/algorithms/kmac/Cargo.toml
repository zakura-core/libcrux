[package]
description = "Libcrux KMAC implementation"
name = "libcrux-kmac"
readme = "Readme.md"
version = "0.0.3"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/kmac.rs"

[dependencies]
libcrux-sha3.workspace = true

[target.'cfg(hax)'.dependencies]
hax-lib = { workspace = true, optional = true }

[features]
# Proof tooling. `cargo hax` builds with `--cfg hax` and needs this feature
# for the `cfg(hax)` code; it is optional so that `hax-lib` stays out of
# the lockfiles of crates that depend on this one.
hax = ["dep:hax-lib", "libcrux-sha3/hax"]

[dev-dependencies]
libcrux-kats = { workspace = true, features = ["kmac"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hax)'] }
