[package]
name = "libcrux-hkdf"
version = "0.0.10"
description = "Libcrux HKDF implementation"
readme = "Readme.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
path = "src/hkdf.rs"

[features]
check-secret-independence = ["libcrux-secrets/check-secret-independence"]

# Proof tooling: enables the `hax` feature of the libcrux dependencies, which
# builds with `--cfg hax` (e.g. `cargo hax`) need.
hax = ["libcrux-hmac/hax", "libcrux-secrets/hax"]

[dependencies]
libcrux-hmac = { workspace = true, features = [
    "expose-hacl",
] }
libcrux-hacl-rs = { workspace = true, features = ["alloc"] }
libcrux-secrets.workspace = true

[dev-dependencies]
libcrux-kats = { path = "../../testing/kats", features = ["hkdf", "kda"] }
hkdf = "0.13"
sha3 = "0.11"
