[package]
name = "libcrux-curve25519"
description = "Formally verified curve25519 ECDH library"
version = "0.0.10"
readme = "Readme.md"

authors.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
libcrux-hacl-rs.workspace = true
libcrux-macros.workspace = true
libcrux-traits.workspace = true
libcrux-secrets.workspace = true

[features]
# Checking secret independence
check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

# Proof tooling: enables the `hax` feature of the libcrux dependencies, which
# builds with `--cfg hax` (e.g. `cargo hax`) need.
hax = ["libcrux-secrets/hax", "libcrux-traits/hax"]

[dev-dependencies]
libcrux-traits = { workspace = true, features = ["generic-tests"] }
libcrux-kats = { workspace = true, features = ["xecdh"] }
